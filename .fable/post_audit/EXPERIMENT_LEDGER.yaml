schema: argos-post-audit-experiment-ledger-v1
created: "2026-08-20"
policy: >
  TODO experimento entra aqui, inclusive (especialmente) os que falham.
  Entradas LEDGER-SEED-* registram experimentos ANTERIORES ao ciclo, para que
  não sejam repetidos sem evidência nova. OPT_00 deve completar os campos
  marcados TO_ENUMERATE lendo docs/ e casos/qualification/hybrid_v1/.
outer_inspection_counter: 0

entries:

  - experiment_id: LEDGER-SEED-001
    baseline_commit: "pré-auditoria (ver docs/131)"
    candidate_commit: n/a
    hypothesis: "embeddings/medidas físicas separam coorte de origem"
    change: "nenhuma (probe diagnóstica)"
    result: "probe de origem: 100% (embeddings), 98,75% (medidas físicas)"
    metrics: {origin_probe_embeddings: 1.00, origin_probe_physical: 0.9875}
    decision: "limitação documentada (SR-007)"
    reason: "separabilidade quase perfeita"
    evidence: "docs/131_FRENTE1_RESULTADO.md:21,85; docs/134_PLANO_META_75_75.md:53"
    reverted: n/a
    lessons: "probes GLOBAIS estão saturadas; próxima informação útil é LOCALIZAÇÃO por estágio/variante (H-01), não repetição"
    do_not_repeat_without_new_evidence: true

  - experiment_id: LEDGER-SEED-002
    baseline_commit: "artefatos assinados (prediction_signature nos freezes; enumerado em OPT_00 2026-08-24)"
    candidate_commit: n/a
    hypothesis: "vocabulário clínico fino (subtipos) melhora sobre binário"
    change: "ablação lld binary vs clinical_subtype (n=335 LLD, 157+178, 14 falhas no denominador)"
    result: "EMPATE no agregado: binário sens 76,4/spec 75,8/bal 76,14 vs subtipo 75,2/77,0/76,06 — ambos passed_75_75; delta de balanced accuracy 0,08 pp"
    metrics: {binario: {sens: 0.7643, spec: 0.7584, bal: 0.7614}, subtipo: {sens: 0.7516, spec: 0.7697, bal: 0.7606}, n: 335}
    decision: "vocabulário fino não pagou no agregado do LLD; multiclass oficial usa a via consolidada"
    reason: "sem ganho mensurável; complexidade extra sem retorno agregado (trade sens↔spec apenas)"
    evidence: "hybrid_v1/ablation_lld_binary_oof_evaluation_v1/evaluation.json e ablation_lld_clinical_subtype_oof_evaluation_v1/evaluation.json; índice em post_audit/evidence/OPT00/"
    reverted: n/a
    lessons: "existe comparação congelada de vocabulários — insumo direto para H-05 fase A; o eixo útil do vocabulário é DISTRIBUIÇÃO por coorte, não agregado"
    do_not_repeat_without_new_evidence: true

  - experiment_id: LEDGER-SEED-003
    baseline_commit: "artefatos assinados em hybrid_v1 (enumerado em OPT_00 2026-08-24)"
    candidate_commit: n/a
    hypothesis: "fusão tardia de sinais melhora o estimador"
    change: "late fusion (subset 132); multi_signal_fusion (467); fusão estimador oficial v1→v2 (por coorte, gate II)"
    result: >
      TRÊS resultados NEGATIVOS: late fusion 73,0/71,0/bal 72,0 em n=132 (REPROVADA
      75/75, embora acima de cada componente: medsiglip 68,0, v23 63,0, radiomics
      55,4, patch2.5D 46,0); multi_signal_fusion em n=467 bal 72,8 — ABAIXO do
      baseline oficial single (76,0); fusão estimador oficial gate_ii_passed=False
      em v1 E v2 (v2 adicionou estimador H e continuou reprovada).
    metrics: {late_fusion_132: {sens: 0.730, spec: 0.710, bal: 0.720, passed: false}, multi_signal_467: {bal: 0.728, passed: false}, fusao_oficial: {gate_ii_v1: false, gate_ii_v2: false}}
    decision: "NENHUMA fusão promovida; Etapa C single permaneceu o regime oficial"
    reason: "fusões batem componentes fracos mas não batem o baseline oficial nem o gate"
    evidence: "hybrid_v1/late_fusion_oof_evaluation_v1, multi_signal_fusion_oof_evaluation_v1, fusao_estimador_oficial_v1/v2/results.json"
    reverted: n/a
    lessons: "confirma o manuscrito: complexidade nem sempre produz ganho; nova proposta de fusão precisa explicar POR QUE superaria estes 3 negativos congelados"
    do_not_repeat_without_new_evidence: true

  - experiment_id: LEDGER-SEED-004
    baseline_commit: "embeddings congelados em hybrid_v1 (enumerado em OPT_00 2026-08-24)"
    candidate_commit: n/a
    hypothesis: "variantes de representação/modalidade/fase mudam o desempenho"
    change: "famílias de embeddings e avaliações por variante (43 evaluation.json congeladas)"
    result: >
      Índice completo em post_audit/evidence/OPT00/frozen_evaluations_index_2026-08-24.txt.
      Somente 5/43 passaram 75/75 (todas nos regimes LLD-335 ou 467-multiclass);
      monophase_delayed v1 chegou a 76,8 no LLD-335 mas TODAS as variantes
      OpenSwiss-only ficaram entre 45-63 bal (n=44-132) — perda de transferência
      do SR-007 quantificada; LoRA 72,7 > head 70,0 (ambas reprovadas em 467);
      baseline oficial = multiclass_oof_v1 (75,9/76,1, n=467, passed).
    metrics: {passaram_75_75: 5, total_avaliacoes: 43, oficial: {sens: 0.759, spec: 0.761, n: 467}}
    decision: "multiclass (Etapa C) promovida; variantes documentadas como não-superiores ou coorte-dependentes"
    reason: "nenhuma variante generalizou para OpenSwiss; ganhos locais no LLD não transferem"
    evidence: "post_audit/evidence/OPT00/frozen_evaluations_index_2026-08-24.txt (43 dirs)"
    reverted: n/a
    lessons: "os embeddings destas variantes são o insumo de H-01 (probes comparativas) — reuso, não recomputação; o índice é a lista do-not-repeat"
    do_not_repeat_without_new_evidence: true

  - experiment_id: LEDGER-SEED-005
    baseline_commit: "lock atual"
    candidate_commit: n/a
    hypothesis: "ROI correta (manual) tem teto superior ao da seleção automática"
    change: "avaliação com ROI de referência"
    result: "teto distinto demonstrado; a linha de candidatos LOCALIZADOS automáticos congelada em hybrid_v1 ficou em bal 50,2-52,9 (n=87; top8/fused/dynamic/hgb — nenhuma passou), confirmando que a seleção automática de ROI não captura o sinal que a ROI correta demonstra"
    metrics: {localized_top8: 0.502, fused_top8: 0.525, dynamic_top8: 0.514, dynamic_hgb: 0.529, n: 87}
    decision: "localização e classificação tratadas como problemas distintos"
    reason: "gap de localização identificado"
    evidence: "manuscrito; SR-013"
    reverted: n/a
    lessons: "melhorar classificação não fecha o gap de localização; qualquer hipótese de localizador é experimento separado"
    do_not_repeat_without_new_evidence: true

  - experiment_id: DS-PROBE-01
    baseline_commit: "a5023b7 (medição; nada alterado)"
    candidate_commit: n/a
    hypothesis: "a separabilidade de origem difere entre variantes de representação, localizando onde o sinal entra (H-01)"
    change: "nenhuma (medição sobre artefatos congelados; scripts em post_audit/analysis/ds_probe_01*.py)"
    result: >
      REFUTADA a premissa de localização por fase: AUC de origem = 1,0 nas 4
      famílias multi-coorte (stage_a/venosa/arterial/delayed; n=448-451;
      controle permutado ~0,5; idêntico condicionado à predição OOF). O sinal
      está a MONTANTE da escolha de fase. Espectral (stage_a): top-1 PC
      sozinho separa (0,9997) — origem é o eixo dominante de variância — e o
      sinal é DIFUSO (resíduo 0,772 mesmo após deflacionar 32 direções).
      Variantes crop/fixed/enhancement/edgeonly/t2dwi são LLD-only (probe de
      origem impossível nelas — registrado no inventário).
    metrics: {auc_origem_todas_familias: 1.0, top1_pc: 0.9997, residuo_apos_32_deflacoes: 0.772, controle_permutado: "0.49-0.53", n: 451}
    decision: "H-01 CONCLUÍDA; família de hipóteses 'remoção de domínio em embedding' marcada do-not-attempt"
    reason: "sinal dominante E difuso: projeção/adversarial em embedding não tem subespaço pequeno para remover; destruiria sinal clínico"
    evidence: "post_audit/evidence/DS-PROBE-01/probe_results_2026-08-24.json e spectrum_results_2026-08-24.json; task TASK-2026-08-24-DS-PROBE-01"
    reverted: n/a
    lessons: >
      (1) origin-probe AUC saturada não discrimina candidatos — endpoint útil
      de dependência de domínio é LODO/transfer/por-coorte; (2) intervenção
      anti-shortcut, se algum dia proposta, deve agir no nível da
      imagem/pré-processamento como CONTROLLED_EXPERIMENT gated com LODO
      primário; (3) p>>n exige apoiar conclusões em resultados imunes
      (top-1 PC, curva de deflação, invariância entre variantes).
    do_not_repeat_without_new_evidence: true

  - experiment_id: LEDGER-SEED-006
    baseline_commit: "auditoria de retry de 2026-07-31 (docs/158)"
    candidate_commit: n/a
    hypothesis: "parte das 14 falhas LLD era ambiental (máquina), não algorítmica"
    change: "reexecução das 2 tentativas originais de segmentação com MESMO timeout/gate, máquina saudável; previsão pré-registrada"
    result: >
      Separação perfeita: 9/9 'infraestrutura' recuperadas (8 timeout 75s + 1
      RAM; passaram em 35-84s) e 0/5 'reais' recuperadas (segmentação termina e
      acha 0/8/216 voxels de fígado). Labels das falhas (da auditoria): 9
      recuperadas = 2 HCC+7 neg; 5 restantes = 3 HCC+1 FNH+1 hemangioma.
      Melhor caso LLD com os 9: sens 74,52% (<75) — gate continua reprovado.
      Números oficiais SUBESTIMAM o sistema em ~+1pp sens/+3pp spec no LLD por
      limitação de execução.
    metrics: {recuperadas_infra: 9, reais: 5, lld_melhor_caso_sens: 0.7452, lld_oficial_sens: 0.7325}
    decision: "documentar (docs/158) e NÃO regenerar a cadeia agora; regeneração incremental quando houver outro motivo (ex.: segunda coorte)"
    reason: "custo de horas + risco de vínculo de assinatura vs ganho que não muda gate; denominador nunca foi alterado (SCI-004 respeitado)"
    evidence: "docs/158_FALHAS_TECNICAS_AMBIENTAIS.md; casos/qualification/lld_mmri_v23/prepared/external_segmentation_retry_v1/ (na máquina de origem)"
    reverted: n/a
    lessons: "falhas 'técnicas' têm duas naturezas com labels desbalanceados (reais são desproporcionalmente positivas: 3/5); previsão pré-registrada é o padrão a seguir"
    do_not_repeat_without_new_evidence: true

  - experiment_id: FAIL-01
    baseline_commit: "17e7857 (medição; nada alterado)"
    candidate_commit: n/a
    hypothesis: "as 16 falhas se concentram em poucas causas classificáveis e o teto de recuperação é computável (H-02)"
    change: "nenhuma (medição sobre artefatos congelados)"
    result: >
      CONFIRMADA por duas rotas independentes. Rota A (esta task, agregados
      congelados): 16 = 14 LLD + 2 OSW, todas 'no_verified_liver_enriched_panel_collection'
      (panel_count=0); composição por label das LLD via by_clinical_subtype:
      5 positivas (hcc) + 9 negativas — bate EXATAMENTE com a rota B (docs/158,
      retry real de 31/07): 9 ambientais recuperáveis + 5 reais. Banda de teto
      desta task (x=5): sens 78,2/spec 80,6 no 467; realista 77,7/79,7. A doc
      já decidiu: documentado, regeneração adiada. Residual aberto: as 2
      falhas OSW não classificadas (infra vs real) e a inspeção visual dos 5
      casos reais — ambos exigem artefatos da máquina de origem (BLK).
    metrics: {falhas: 16, lld: 14, osw: 2, causa_unica: "no_verified_liver_enriched_panel_collection", teto_sens_x5: 0.7818, teto_spec_x5: 0.8057}
    decision: "H-02 CONCLUÍDA; nenhum experimento novo proposto — a decisão de 31/07 permanece válida; ganho conhecido e documentado, não incorporado por design"
    reason: "recuperação já demonstrada e quantificada; incorporação exige regenerar cadeia assinada — gatilho definido (outro motivo de regeneração)"
    evidence: "post_audit/tasks/TASK-2026-08-24-FAIL-01_EVIDENCE.md; candidate_dataset_stage_a_v1/technical_failures.jsonl; evaluation by_dataset/by_clinical_subtype"
    reverted: n/a
    lessons: >
      (1) o registro congelado de falhas + agregados por subtipo permitem
      reconstruir composição por label SEM ler labels protegidos; (2) docs/158
      faltava no ledger — experimentos pré-ciclo devem ser garimpados de docs/
      antes de propor qualquer coisa; (3) failure patterns por coorte (D12):
      falhas raras em OSW (2/132) vs LLD (14/335) — sem assimetria dramática.
    do_not_repeat_without_new_evidence: true

  - experiment_id: MEAS-01
    baseline_commit: "6084dd6 (medição; nada alterado)"
    candidate_commit: n/a
    hypothesis: "H-03: o resultado é sensível ao mecanismo de seleção; H-04: o agregado depende da composição de coortes"
    change: "nenhuma (medição label-free determinística; script em post_audit/analysis/meas_01_stability_cohorts.py)"
    result: >
      H-03: seleção instável no nível de hiperparâmetro (4/5 folds numa banda
      estreita thr 0,41-0,51; fold 2 é outlier qualitativo: C=1,0/max/0,848)
      mas com impacto decisório LIMITADO (transplantes de threshold flipam
      2,2-3,6% das predições fora do outlier; fragilidade <0,05 = 4,7% dos
      casos). Triangulação: inner 0,706-0,753 (pessimista, são) < outer
      honesto 0,760 < seleção 0,796 (otimista). H-04: bal varia só 0,62 pp
      entre 3 esquemas de peso; mix sens/spec é sensível (igual-peso: sens
      0,795/spec 0,732); ICs por coorte largos (n=44) impedem conclusão por
      coorte — sustenta a contenção de claims.
    metrics: {threshold_amplitude: 0.434, flips_transplante_normal: "0.022-0.036", flips_outlier_fold2: 0.228, indice_composicao_pp: 0.62, inner_bal: "0.706-0.753"}
    decision: "AMBAS concluídas; nenhum microexperimento proposto; gatilho de revisita = promoção futura que dependa de escolha de threshold"
    reason: "instabilidade real porém de impacto limitado; mudança na regra de seleção seria SCIENTIFIC_CHANGE com ganho esperado pequeno"
    evidence: "post_audit/evidence/MEAS-01/meas01_results_2026-08-24.json; TASK-2026-08-24-MEAS-01_EVIDENCE.md"
    reverted: n/a
    lessons: >
      (1) fold_selection.json congelado carrega as métricas INNER — dev
      signal completo sem labels; (2) o inner NÃO é otimista neste protocolo
      (treinos menores) — otimismo mora na seleção-sobre-outer; (3) em n=44,
      deltas por coorte <15 pp são ruído — calibrar o promotion gate.
    do_not_repeat_without_new_evidence: true
