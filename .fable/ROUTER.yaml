  "dtwin/learning/multiphase_ingest.py": {risco: HIGH, rotas: [DICOM, HARMONIZATION_RESAMPLING, REGISTRATION]}
  "dtwin/segmentation_subprocess.py|seg_worker.py|segmentation_contract.py": {risco: HIGH, rotas: [SEGMENTATION, GEOMETRY, VOLUMETRY]}
  "dtwin/medgemma_panel*.py|learning/exam_to_panels.py": {risco: HIGH, rotas: [PANELS, EMBEDDINGS, MODEL_LOADING]}
  "dtwin/learning/medsiglip_embeddings.py": {risco: HIGH, rotas: [EMBEDDINGS, MODEL_LOADING, CACHE_ARTIFACTS]}
  "dtwin/learning/medsiglip_*classifier.py|splits.py|protocol.py": {risco: HIGH, rotas: [ML_CLASSIFICATION, CROSS_VALIDATION, METRICS_STATISTICS]}
  "dtwin/benchmark/metrics.py|reporting.py|runner.py": {risco: "HIGH para métricas", rotas: [METRICS_STATISTICS, LOGGING_AUDIT_PROVENANCE, PIPELINE]}
  "dtwin/candidate_*.py": {risco: HIGH, rotas: [LOCALIZATION, GEOMETRY]}
  "dtwin/volumetry.py": {risco: HIGH, rotas: [VOLUMETRY, GEOMETRY, SEGMENTATION]}
  "dtwin/viewer_artifacts.py|viewer_xr.py|viewer/": {risco: "HIGH se medição", rotas: [RECONSTRUCTION_3D, FRONTEND, WEBXR]}
  "webapp/server.py": {risco: "acoplamento científico", rotas: [PIPELINE, FRONTEND, ORCHESTRATION, "rotas alvo"]}
  "profiles/figado.yaml|configs/": {risco: "constantes científicas", rotas: [CONFIG_PROFILES, "rota semântica"], nota: "nunca 'só YAML'"}
  "compose*.yaml|docker/|INICIAR_*.cmd|run_*.ps1|run_mac.sh": {rotas: [DOCKER_DEPLOYMENT, SECURITY, DEPENDENCIES], nota: "runtime oficial nativo; compose preservado só p/ distribuição portátil ARM64 (PH-02)"}

expansoes_multimodulo:
  "mask changes after resampling": [GEOMETRY, HARMONIZATION_RESAMPLING, SEGMENTATION, VOLUMETRY]
  "stale embedding cache": [EMBEDDINGS, MODEL_LOADING, CACHE_ARTIFACTS, LOGGING_AUDIT_PROVENANCE]
  "wrong patient classification": [ML_CLASSIFICATION, PANELS, EMBEDDINGS, CROSS_VALIDATION, METRICS_STATISTICS, "nunca relabel/diagnóstico"]
  "optimize panels": [PANELS, PERFORMANCE, EMBEDDINGS, MODEL_LOADING, TESTS_BUILD_ENVIRONMENT, "SCIENTIFIC_REGRESSION se pixels mudarem"]
  "deformed mesh": [RECONSTRUCTION_3D, GEOMETRY, SEGMENTATION, VOLUMETRY, "separar visual de quantitativo"]

authority_shortcuts:
  text_report_only: "inspecionar e reportar"
  LOW: "baseline → contrato/characterization → patch → evidência focada/global"
  MEDIUM: "investigar/testar/propor; aplicar só com autorização explícita; promover se científico"
  HIGH: "nenhum patch semântico sem aprovação HG"
  OUT_OF_AUTHORITY: "STOP_REPORT"
