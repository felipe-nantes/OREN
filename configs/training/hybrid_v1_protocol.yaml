schema: argos-hybrid-training-config-v1
candidate_id: hybrid_v1_medsiglip_frozen_supervised
target_condition: focal_liver_lesion_suspicion

protected_label_sources:
  - dataset_id: openswisshcc_development
    path: casos/qualification/openswisshcc_v1/prepared/development_v1/protected_ground_truth/development_labels.jsonl
  - dataset_id: openswisshcc_consumed_holdout
    path: casos/qualification/openswisshcc_v1/prepared/holdout_v21_protected_labels/holdout_labels.jsonl
  - dataset_id: lld_mmri
    path: casos/qualification/lld_mmri_v23/prepared/external_protocol_v1/protected_ground_truth/labels.jsonl

validation:
  strategy: nested_patient_grouped_cross_validation
  outer_folds: 5
  inner_folds: 4
  seed: 20260724
  repeated_cv:
    repeats: 50
    folds: 5
  leave_one_dataset_out: true
  threshold_selection: inner_oof_only
  feature_selection: inner_training_only

acceptance:
  sensitivity_minimum: 0.75
  specificity_minimum: 0.75
  end_to_end_seconds_maximum: 180
  localizer_recall_minimum: 0.85
  confidence_interval_95_required: true
  must_compare_with_v23_full132: true
  must_report_by_dataset: true

failure_policy:
  technical_failure_counts_as_error: true
  inconclusive_counts_as_error: true
  excluded_from_primary_metric: false

safety:
  protected_labels_never_sent_to_feature_extractor: true
  lesion_masks_for_training_or_retrospective_audit_only: true
  lesion_masks_never_sent_to_medsiglip_inference: true
  lesion_masks_never_sent_to_medgemma: true
  research_only: true
  clinical_use_allowed: false
