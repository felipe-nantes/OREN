# Development-only domain-balanced experiment. The consumed OpenSwiss holdout
# is excluded from fit and every selection step.
schema: argos-hybrid-medsiglip-multiclass-config-v1
candidate_id: oren_medsiglip_monophase_delayed_domain_balanced_v3
model: domain_and_class_balanced_multinomial_logistic_regression
solver: lbfgs
label_granularity: binary
restrict_to_dataset_ids:
  - lld_mmri
  - openswisshcc_development
positive_classes:
  - positive_unspecified
regularization_c_grid: [0.001, 0.01, 0.1, 1.0]
panel_probability_aggregations: [mean, max, top2_mean]
standardization: inner_or_outer_training_panels_only
training_case_weighting: equal_dataset_class_case
threshold_selection: inner_oof_only
seed: 20260804
max_iter: 3000
technical_failures_count_as_errors: true
deployment:
  analysis_scenario: monophase_medsiglip
  panel_image_mode: single_phase_delayed_grayscale_liver_enriched
  expected_panel_counts: [2, 3]
  source_phase_contract: exactly_one_real_series
  source_phase_key: t1_delayed
  dynamic_enhancement_information_present: false
  generalization_estimate_source: nested_oof_lld_plus_openswiss_development_domain_balanced
research_only: true
clinical_use_allowed: false
