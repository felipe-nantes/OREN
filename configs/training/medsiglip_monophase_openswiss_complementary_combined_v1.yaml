  complementary_real_sequences: [t2_haste, dwi_trace_run_03, dwi_adc]
  synthetic_sequences_created: false
  lesion_mask_allowed: false
  automatic_liver_mask_use: crop_and_coverage_only
  exact_coverage_required_for_materialized_sequence: true
  rigid_registration_enabled_in_full_cohort: false
research_only: true
clinical_use_allowed: false
