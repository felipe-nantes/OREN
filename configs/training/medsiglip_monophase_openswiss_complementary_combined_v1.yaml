schema: argos-hybrid-medsiglip-multiclass-config-v1
candidate_id: oren_medsiglip_monophase_openswiss_t2_dwi_adc_combined_v1
model: class_balanced_multinomial_logistic_regression
solver: lbfgs
label_granularity: binary
restrict_to_dataset_ids: [openswisshcc_development]
