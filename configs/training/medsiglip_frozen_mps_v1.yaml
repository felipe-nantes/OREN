# Extrator MedSigLIP congelado para Apple Silicon (MPS).
#
# Idêntico a medsiglip_frozen_v1.yaml em TUDO que afeta a representação --
# mesmo modelo, mesma revisão fixada, mesmo tamanho de entrada, mesmo pooling,
# mesma normalização L2, mesma dimensão de saída. As duas únicas diferenças são
# de execução, não de método:
#
#   device: mps      em vez de cuda
#   dtype:  float32  em vez de float16
#
# Por que float32 e não float16: o bundle de produção foi treinado sobre
# embeddings extraídos em float16/CUDA. Em MPS, a aritmética float16 tem
# histórico de divergência maior que em CUDA, e um embedding levemente diferente
# pode virar uma decisão diferente em casos próximos do limiar (0,4749).
# float32 é mais lento, porém numericamente mais próximo da referência.
#
# ISSO NÃO É EQUIVALÊNCIA PROVADA. Rode a verificação antes de confiar em
# qualquer número produzido neste caminho:
#
#   .venv/bin/python tools/verify_medsiglip_device_agreement.py
#
# Ela mede a concordância dos embeddings deste config contra o cache congelado
# de referência e falha se a divergência puder mudar decisões.
