schema: argos-hybrid-medsiglip-multiclass-config-v1
candidate_id: oren_medsiglip_monophase_delayed_axial_instances_v1
model: class_balanced_multinomial_logistic_regression
solver: lbfgs
label_granularity: clinical_subtype
restrict_to_dataset_ids: [lld_mmri]
positive_classes: [hcc]
regularization_c_grid: [0.01, 0.1, 1.0]
panel_probability_aggregations: [mean, max, top2_mean]
standardization: inner_or_outer_training_instances_only
threshold_selection: inner_oof_only
persist_label_blind_class_probabilities: true
subtype_probability_aggregation: top2_mean
seed: 20260803
max_iter: 3000
technical_failures_count_as_errors: true
representation_contract:
  source_phase: t1_delayed_real_single_series
  candidate_unit: one_axial_liver_slice
  exact_liver_voxel_coverage_required: true
  lesion_mask_allowed: false
  binary_baseline_changed: false
research_only: true
clinical_use_allowed: false
