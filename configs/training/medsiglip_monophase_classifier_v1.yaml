# Frozen MedSigLIP encoder + lightweight binary head for a single portal/venous
# phase. Development is restricted to LLD-MMRI; OpenSwissHCC remains available
# as an out-of-dataset monophase ablation after the production artifact freezes.
schema: argos-hybrid-medsiglip-multiclass-config-v1
candidate_id: oren_medsiglip_monophase_portal_venous_binary_v1
model: class_balanced_multinomial_logistic_regression
solver: lbfgs
label_granularity: binary
restrict_to_dataset_ids:
  - lld_mmri
positive_classes:
  - positive_unspecified
regularization_c_grid:
  - 0.01
  - 0.1
  - 1.0
panel_probability_aggregations:
  - mean
  - max
  - top2_mean
standardization: inner_or_outer_training_panels_only
threshold_selection: inner_oof_only
seed: 20260803
max_iter: 3000
technical_failures_count_as_errors: true
deployment:
  analysis_scenario: monophase_medsiglip
  panel_image_mode: single_phase_portal_venous_grayscale_liver_enriched
  expected_panel_counts: [2, 3]
  source_phase_contract: exactly_one_real_series
  dynamic_enhancement_information_present: false
  generalization_estimate_source: nested_oof_lld_monophase_ablation
research_only: true
clinical_use_allowed: false
