# Ablação da Etapa C — braço "clinical_subtype", restrito ao LLD-MMRI.
#
# Pergunta: o ganho da supervisão multiclasse vem de biologia (discriminação de
# mimetizadores) ou de calibração condicionada à coorte? Restringir ao LLD
# elimina classes específicas de coorte por construção: as quatro classes finas
# são todas do mesmo dataset, então não existe domínio a calibrar.
#
# Os dois braços usam o MESMO módulo, MESMOS embeddings, MESMOS splits
# congelados (apenas intersectados com o universo LLD, sem reatribuir folds),
# MESMA família de modelo, MESMAS agregações e MESMA seleção de threshold no
# inner CV. A ÚNICA variável é label_granularity.
schema: argos-hybrid-medsiglip-multiclass-config-v1
candidate_id: hybrid_v1_medsiglip_lld_clinical_subtype_ablation
model: class_balanced_multinomial_logistic_regression
solver: lbfgs
label_granularity: clinical_subtype
restrict_to_dataset_ids:
  - lld_mmri
positive_classes:
  - hcc
regularization_c_grid:
  - 0.01
  - 0.1
  - 1.0
panel_probability_aggregations:
  - mean
  - max
  - top2_mean
standardization: inner_or_outer_training_panels_only
threshold_selection: inner_oof_only
seed: 20260724
max_iter: 3000
technical_failures_count_as_errors: true
research_only: true
clinical_use_allowed: false
