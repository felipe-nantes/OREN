# v21 external cohort reader. It preserves the v11/v4 uniform-9 representation
# and changes only the response mode to balanced continuous choice scores.
extends: medgemma_local_4b_multiphase_fast_pathology.yaml
medgemma_screening:
  medgemma:
    response_mode: choice_classification
    timeout_seconds: 120
    max_retries: 0
    response_validation_max_retries: 0
    max_output_tokens: 64
  panel:
    strategy: uniform_9
    axial_slices: 9
  rag:
    enabled: false

