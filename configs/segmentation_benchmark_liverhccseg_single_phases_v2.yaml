schema: argos-liver-segmentation-benchmark-config-v2
status: retrospective_development_reference_evaluation
research_only: true

cohort:
  id: liverhccseg_single_phase_development_v2
  root: data/prepared/liverhccseg_v21_blind
  source_name: t1_venous.nii.gz
  reference_name: liver_mask.nii.gz
  ground_truth_used_only_after_prediction: true

models:
  - id: total_mr
    display_name: TotalSegmentator total_mr venous
    color: "#00D8FF"
    required: true
    mask_template: experiments/total_mr_liverhccseg_venous_gpu_full_v2/masks/{case_id}.nii.gz
  - id: mrsegmentator_native
    display_name: MRSegmentator native
    color: "#9B5DE5"
    required: true
    mask_template: experiments/mrsegmentator_liverhccseg_native_gpu_fast_v2/masks/{case_id}.nii.gz
  - id: mrsegmentator_arterial
    display_name: MRSegmentator arterial
    color: "#F15BB5"
    required: true
    mask_template: experiments/mrsegmentator_liverhccseg_arterial_gpu_fast_v2/masks/{case_id}.nii.gz
  - id: mrsegmentator_venous
    display_name: MRSegmentator venous
    color: "#00BBF9"
    required: true
    mask_template: experiments/mrsegmentator_liverhccseg_venous_gpu_fast_v2/masks/{case_id}.nii.gz
  - id: mrsegmentator_delayed
    display_name: MRSegmentator delayed
    color: "#00F5D4"
    required: true
    mask_template: experiments/mrsegmentator_liverhccseg_delayed_gpu_fast_v2/masks/{case_id}.nii.gz
  - id: guarded_union_fill12
    display_name: Four-phase guarded union + fill
    color: "#FF9F1C"
    required: true
    mask_template: experiments/mrsegmentator_liverhccseg_registered_guarded_union_fill12_v2/masks/{case_id}.nii.gz

output:
  root: experiments/liver_segmentation_benchmark_liverhccseg_single_phases_v2
  generate_gallery: true
