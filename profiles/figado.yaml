# =====================================================================
# Perfil de órgão: FÍGADO
# ---------------------------------------------------------------------
# Toda a configuração específica do órgão mora AQUI, não no código.
# Trocar de órgão = copiar este arquivo e ajustar (ex.: baco.yaml com
# rotulo_alvo: spleen). O motor (dtwin/) não muda.
# Ver contexto/04_ARQUITETURA.md e contexto/02_DOMINIO_CLINICO.md.
# =====================================================================

id: figado
nome_exibicao: "Fígado"

# Estado regulatório (contexto/03_REGULATORIO_LGPD.md). O MVP roda em PESQUISA;
# a transição para CLINICO é um gate formal, não um simples valor aqui.
estado_regulatorio: PESQUISA

# Modalidade aceita. O estágio 1 ABORTA se o exame não for desta modalidade.
# "MR" é o código DICOM padrão (tag 0008,0060) para ressonância; "MRI" é aceito
# por conveniência/legado. Sem "MR" o gate rejeitaria exames de RM legítimos.
modalidade: [MR, MRI]

# Normalização de referência/inspeção (zscore p/ RM; minmax disponível).
# OBS: NÃO é o que vai para o segmentador — o TotalSegmentator normaliza internamente.
normalizacao: zscore

# --- Segmentação do ÓRGÃO (automática) -------------------------------
segmentacao_orgao:
  motor: totalsegmentator_mri
  motor_task: total_mr        # task de RM do TotalSegmentator (50 estruturas)
  rotulo_alvo: liver          # classe a extrair da saída do modelo

# --- Anatomia interna para o visualizador 3D (automática, RM) ---------
# Estruturas opcionais: uma ausência não invalida a máscara hepática nem a
# triagem MedGemma. Todas são derivadas exclusivamente do exame do caso.
segmentacao_anatomia:
  habilitada: true
  tarefas:
    - motor_task: liver_segments_mr
      estruturas:
        - {papel: couinaud_i,    rotulo: liver_segment_1, nome: "Segmento Couinaud I",    cor: "#E69F00", material: segment, opacidade: 0.82}
        - {papel: couinaud_ii,   rotulo: liver_segment_2, nome: "Segmento Couinaud II",   cor: "#56B4E9", material: segment, opacidade: 0.82}
        - {papel: couinaud_iii,  rotulo: liver_segment_3, nome: "Segmento Couinaud III",  cor: "#009E73", material: segment, opacidade: 0.82}
        - {papel: couinaud_iv,   rotulo: liver_segment_4, nome: "Segmento Couinaud IV",   cor: "#F0E442", material: segment, opacidade: 0.82}
        - {papel: couinaud_v,    rotulo: liver_segment_5, nome: "Segmento Couinaud V",    cor: "#0072B2", material: segment, opacidade: 0.82}
        - {papel: couinaud_vi,   rotulo: liver_segment_6, nome: "Segmento Couinaud VI",   cor: "#D55E00", material: segment, opacidade: 0.82}
        - {papel: couinaud_vii,  rotulo: liver_segment_7, nome: "Segmento Couinaud VII",  cor: "#CC79A7", material: segment, opacidade: 0.82}
        - {papel: couinaud_viii, rotulo: liver_segment_8, nome: "Segmento Couinaud VIII", cor: "#8C564B", material: segment, opacidade: 0.82}
    - motor_task: total_mr
      estruturas:
        - {papel: vesicula_biliar, rotulo: gallbladder, nome: "Vesícula biliar", cor: "#62A65A", material: gallbladder, opacidade: 0.90}
        - {papel: veia_porta_esplenica, rotulo: portal_vein_and_splenic_vein, nome: "Veia porta e esplênica", cor: "#16A6C9", material: vessel, opacidade: 0.92}
        - {papel: veia_cava_inferior, rotulo: inferior_vena_cava, nome: "Veia cava inferior", cor: "#4D78C8", material: vessel, opacidade: 0.92}

# --- Segmentação da LESÃO (manual no 3D Slicer no MVP) ----------------
segmentacao_lesao:
  modo: manual_slicer
  ferramentas_sugeridas: [threshold, region_growing, paint]

# --- Refino das máscaras ---------------------------------------------
refino:
  orgao:
    opening: true             # remove ruído/pontas
    opening_radius: 2
    min_volume_voxels: 300    # descarta fragmentos
  lesao:
    opening: false            # NÃO erodir: lesão pequena é real
    opening_radius: 1
    min_volume_voxels: 30
  anatomia:
    opening: false            # não erodir segmentos ou vasos finos
    opening_radius: 1
    min_volume_voxels: 20

# --- Geração de malha -------------------------------------------------
mesh:
  nivel_marching_cubes: 0.5
  suavizacao_iteracoes: 30
  feature_angle: 60.0
  taubin_pass_band: 0.1       # Taubin (windowed-sinc): menor = mais suave, preserva volume
  # Reconstrução por campo contínuo (docs/165). A grade de RM hepática chega com
  # 3 a 4x mais espaçamento em Z -- um fígado inteiro pode caber em 23 cortes --,
  # e marchar direto nela produz terraços que são artefato de amostragem, não
  # anatomia. Marchar no campo de distância reamostrado corta a rugosidade pela
  # metade; o isovalor é calibrado por caso para encerrar o volume MEDIDO, então
  # a suavização não custa fidelidade. 0 volta ao caminho antigo.
  reamostragem_isotropica_mm: 0.8
  # sigma 2,0 mm: a varredura mediu rugosidade caindo de 3,2 para 1,6 SEM mudar
  # o desvio medio da borda (0,71 mm nos dois). Acima disso o p95 do desvio passa
  # do meio-voxel da grade -- o piso do que o exame permite saber -- e a malha
  # deixaria de descrever a medicao.
  suavizacao_campo_sigma_mm: 2.0
  max_triangulos: 160000     # decimação quadrática; STL acima disso pesa no navegador
  cor_orgao: "#C8A27D"        # consumido pelo manifesto do visualizador
  cor_lesao: "#D7263D"

# --- Exportação -------------------------------------------------------
exportacao:
  sistema_coordenadas: LPS    # padrão de impressão 3D / 3D Slicer

# --- Flywheel (acervo p/ treino futuro de IA de lesão) ----------------
flywheel:
  dir: "flywheel"

